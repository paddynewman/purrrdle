<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purrrdle</title>
  <style>
    :root {
      --bg-1: #f7f2e8;
      --bg-2: #e8efe7;
      --ink: #1f2d2f;
      --tile: #ffffff;
      --tile-border: #9fb0b2;
      --correct: #2f7d32;
      --present: #b68216;
      --absent: #687478;
      --keyboard-key: #dde6e7;
      --keyboard-ink: #253739;
      --shadow: rgba(24, 33, 34, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: #ffffff;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(0.375rem, env(safe-area-inset-top)) 0.75rem max(0.75rem, env(safe-area-inset-bottom));
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    .app {
      width: min(100%, 430px);
      background: #ffffff;
      border: 0;
      border-radius: 0;
      backdrop-filter: none;
      box-shadow: none;
      padding: 0.5rem 0.9rem 1.1rem;
      display: grid;
      gap: 0.85rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .topbar-controls {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .pill {
      border: 1px solid rgba(38, 54, 56, 0.3);
      background: #f6faf9;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      min-width: 0;
    }

    .pill:active {
      transform: scale(0.98);
    }

    .status {
      min-height: 1.25rem;
      font-size: 0.93rem;
      font-weight: 700;
      text-align: center;
      color: #334649;
    }

    .board {
      display: grid;
      gap: 0.27rem;
      margin: 0 auto;
      width: min(100%, 280px);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.27rem;
    }

    .tile {
      aspect-ratio: 1 / 1;
      border: 2px solid var(--tile-border);
      background: var(--tile);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: clamp(1.07rem, 4.7vw, 1.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, color 120ms ease;
    }

    .tile.filled {
      border-color: #708285;
    }

    .tile.pop {
      animation: pop 120ms ease;
    }

    .tile.correct {
      background: var(--correct);
      border-color: var(--correct);
      color: #fff;
    }

    .tile.present {
      background: var(--present);
      border-color: var(--present);
      color: #fff;
    }

    .tile.absent {
      background: var(--absent);
      border-color: var(--absent);
      color: #fff;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.09); }
      100% { transform: scale(1); }
    }

    .keyboard {
      display: grid;
      gap: 0.35rem;
    }

    .keyrow {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 0.35rem;
    }

    .key {
      border: 0;
      border-radius: 8px;
      background: var(--keyboard-key);
      color: var(--keyboard-ink);
      font-weight: 800;
      font-size: 0.82rem;
      min-height: 3.25rem;
      min-width: 0;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    .key.action {
      grid-column: span 2;
      font-size: 0.72rem;
      letter-spacing: 0;
    }

    .key.correct {
      background: var(--correct);
      color: #fff;
    }

    .key.present {
      background: var(--present);
      color: #fff;
    }

    .key.absent {
      background: var(--absent);
      color: #fff;
    }

    .footer {
      text-align: center;
      font-size: 0.78rem;
      color: #4b5f62;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 24, 0.65);
      padding: 1rem;
      z-index: 10;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: min(100%, 420px);
      max-width: 420px;
      background: #fff;
      border-radius: 0;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.16);
      overflow: visible;
      text-align: center;
      color: var(--ink);
    }

    .modal-content img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      max-height: 320px;
      border-radius: 0;
    }

    .modal-body {
      padding: 1rem 1rem 1.25rem;
    }

    .modal-body h2 {
      margin-bottom: 0.5rem;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    .modal-body p {
      margin: 0 0 1rem;
      font-size: 0.95rem;
      color: #4d6568;
    }

    .modal-close {
      border: none;
      background: #1f2d2f;
      color: #fff;
      border-radius: 999px;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .modal-definition {
      background: #003366;
    }

    .modal-definition:hover {
      background: #00254d;
    }

    .modal-definition:active {
      background: #001a33;
    }
      margin-top: 1rem;
    }

    @media (max-width: 420px) {
      .app {
        padding: 0.425rem 0.65rem 1rem;
        gap: 0.72rem;
      }

      h1 {
        font-size: 1.38rem;
      }

      .board {
        width: min(100%, 253px);
      }

      .row {
        gap: 0.21rem;
      }

      .tile {
        font-size: clamp(0.96rem, 5.6vw, 1.27rem);
      }

      .keyrow {
        gap: 0.25rem;
      }

      .key {
        min-height: 2.875rem;
        font-size: 0.74rem;
        padding: 0 0.12rem;
      }

      .key.action {
        font-size: 0.64rem;
      }

      .pill {
        padding: 0.38rem 0.6rem;
        font-size: 0.78rem;
      }
    }

    @media (max-width: 360px) {
      .app {
        padding: 0.4rem 0.6rem 0.9rem;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
        gap: 0.55rem;
      }

      h1 {
        text-align: center;
      }

      .topbar-controls {
        justify-content: center;
      }

      .board {
        width: min(100%, 235px);
      }

      .key {
        min-height: 2.9375rem;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Purrrdle word game">
    <section id="board" class="board" aria-label="Game board"></section>

    <section class="keyboard" id="keyboard" aria-label="On-screen keyboard"></section>

    <p id="status" class="status" aria-live="polite">Guess the 5-letter word.</p>

  </main>

  <div class="modal" id="celebration-modal" role="dialog" aria-modal="true" aria-labelledby="celebration-title" aria-describedby="celebration-description">
    <div class="modal-content">
      <img id="celebration-image" alt="Celebration cat picture" src="" />
      <div class="modal-body">
        <h2 id="celebration-title">Congratulations!</h2>
        <div class="modal-buttons">
          <button type="button" class="modal-close modal-definition" id="celebration-definition" title="Lookup this word in the Oxford English Dictionary">Dictionary</button>
          <button type="button" class="modal-close" id="celebration-close">Nice!</button>
        </div>
      </div>
    </div>
  </div>

      ["Z", "X", "C", "V", "B", "N", "DEL", "ENTER", "", ""]
    ];

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");

    const keyboardEl = document.getElementById("keyboard");

    let solution = "";
    let guesses = [];
    let currentGuess = "";
    let gameOver = false;
    let enterHoldTimer = null;
    let suppressEnterTap = false;

    const HOLD_MS = 800;

    const allowedWords = new Set(BRITISH_WORDS);
    const CELEBRATION_IMAGES = [
      "cat-01.jpeg", "cat-02.jpeg", "cat-03.jpeg", "cat-04.jpeg", "cat-05.jpeg", "cat-06.jpeg",
      "cat-07.jpeg", "cat-08.jpeg", "cat-09.jpeg", "cat-10.jpeg", "cat-11.jpeg", "cat-12.jpeg", "cat-13.jpeg",
      "cat-14.jpeg", "cat-15.jpeg", "cat-16.jpeg", "cat-17.jpeg", "cat-18.jpeg", "cat-19.jpeg",
      "cat-20.jpeg", "cat-21.jpeg", "cat-22.jpeg", "cat-23.jpeg", "cat-24.jpeg", "cat-25.jpeg", "cat-26.jpeg",
      "cat-27.jpeg", "cat-28.jpeg", "cat-29.jpeg"
    ];

    const STORAGE_PREFIX = "purrrdle-state-";

    function getWordIndexForDate(date = new Date()) {
      const epoch = Date.UTC(2024, 0, 1);
      const today = Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());
      const dayCount = Math.floor((today - epoch) / (24 * 60 * 60 * 1000));
      return ((dayCount % BRITISH_WORDS.length) + BRITISH_WORDS.length) % BRITISH_WORDS.length;
    }

    function getCelebrationImageIndexForDate(date = new Date()) {
      const epoch = Date.UTC(2024, 0, 1);
      const today = Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());
      const dayCount = Math.floor((today - epoch) / (24 * 60 * 60 * 1000));
      return ((dayCount % CELEBRATION_IMAGES.length) + CELEBRATION_IMAGES.length) % CELEBRATION_IMAGES.length;
    }

    function getTodayKey(date = new Date()) {
      return STORAGE_PREFIX + date.toISOString().slice(0, 10);
    }

    function loadSavedState() {
      try {
        const saved = localStorage.getItem(getTodayKey());
        return saved ? JSON.parse(saved) : null;
      } catch (error) {
        return null;
      }
    }

    function saveGameState() {
      try {
        const state = {
          date: new Date().toISOString().slice(0, 10),
          guesses,
          gameOver
        };
        localStorage.setItem(getTodayKey(), JSON.stringify(state));
      } catch (error) {
        // Ignore storage failures.
      }
    }

    function restoreSavedState(state) {
      guesses = Array.isArray(state.guesses) ? state.guesses : [];
      currentGuess = "";
      gameOver = !!state.gameOver;
      updateBoard();
      guesses.forEach((guess, index) => {
        revealGuess(index, scoreGuess(guess, solution));
      });

      if (gameOver) {
        const lastGuess = guesses[guesses.length - 1] || "";
        if (lastGuess === solution) {
          announce("You already solved today's Purrrdle.");
          showCelebrationPopup();
          return;
        }
        announce(`Out of tries. The word was ${solution}.`);
      }
    }

    function pickDailyWord() {
      return BRITISH_WORDS[getWordIndexForDate()].toUpperCase();
    }

    function getCelebrationTitle() {
      const attempts = guesses.length;
      if (attempts <= 1) return "Brilliant!";
      if (attempts === 2) return "Excellent!";
      if (attempts === 3) return "Well done!";
      if (attempts === 4) return "Nice!";
      if (attempts === 5) return "Got it!";
      return "Phew!";
    }

    function showCelebrationPopup() {
      const modal = document.getElementById("celebration-modal");
      const image = document.getElementById("celebration-image");
      const closeButton = document.getElementById("celebration-close");
      const definitionButton = document.getElementById("celebration-definition");
      const title = document.getElementById("celebration-title");
      const index = getCelebrationImageIndexForDate();
      image.src = CELEBRATION_IMAGES[index];
      title.textContent = getCelebrationTitle();
      closeButton.textContent = "Close";
      definitionButton.onclick = () => {
        window.open(`https://www.oed.com/search/dictionary/?scope=Entries&q=${solution.toLowerCase()}`, "_blank", "noopener,noreferrer");
      };
      modal.classList.add("open");

      function closeModal() {
        modal.classList.remove("open");
      }

      function handleOverlayClick(event) {
        if (event.target === modal) {
          closeModal();
        }
      }

      closeButton.onclick = closeModal;
      modal.onclick = handleOverlayClick;
      document.addEventListener("keydown", function onKeyDown(event) {
        if (event.key === "Escape") {
          closeModal();
          document.removeEventListener("keydown", onKeyDown);
        }
      });
    }

    function announce(message) {
      statusEl.textContent = message;
    }

    function createBoard() {
      boardEl.innerHTML = "";
      for (let r = 0; r < ROWS; r += 1) {
        const row = document.createElement("div");
        row.className = "row";
        for (let c = 0; c < COLS; c += 1) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.setAttribute("role", "gridcell");
          tile.dataset.row = String(r);
          tile.dataset.col = String(c);
          row.appendChild(tile);
        }
        boardEl.appendChild(row);
      }
    }

    function makeKey(label) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "key";
      button.dataset.key = label;
      if (label === "ENTER" || label === "DEL") {
        button.classList.add("action");
      }
      button.textContent = label === "DEL" ? "Delete" : label;
      button.setAttribute("aria-label", label === "DEL" ? "Delete letter" : label);

      if (label === "ENTER") {
        const startHold = () => {
          clearTimeout(enterHoldTimer);
          suppressEnterTap = false;
          enterHoldTimer = setTimeout(() => {
            suppressEnterTap = true;
            announce("Hey! No cheating.");
          }, HOLD_MS);
        };

        const endHold = () => {
          clearTimeout(enterHoldTimer);
          enterHoldTimer = null;
          if (suppressEnterTap) {
            suppressEnterTap = false;
            return;
          }
          handleInput(label);
        };

        const cancelHold = () => {
          clearTimeout(enterHoldTimer);
          enterHoldTimer = null;
          suppressEnterTap = false;
        };

        button.addEventListener("touchstart", (event) => {
          event.preventDefault();
          startHold();
        }, { passive: false });
        button.addEventListener("touchend", (event) => {
          event.preventDefault();
          endHold();
        }, { passive: false });
        button.addEventListener("touchcancel", cancelHold);

        button.addEventListener("mousedown", (event) => {
          event.preventDefault();
          startHold();
        });
        button.addEventListener("mouseup", (event) => {
          event.preventDefault();
          endHold();
        });
        button.addEventListener("mouseleave", cancelHold);
        button.addEventListener("click", (event) => event.preventDefault());
        return button;
      }

      button.addEventListener("touchend", (event) => {
        event.preventDefault();
        handleInput(label);
      }, { passive: false });
      button.addEventListener("click", () => handleInput(label));
      return button;
    }

    function createKeyboard() {
      keyboardEl.innerHTML = "";
      KEY_GRID.forEach((row) => {
        const rowEl = document.createElement("div");
        rowEl.className = "keyrow";
        row.forEach((label) => {
          if (!label) {
            const spacer = document.createElement("div");
            spacer.setAttribute("aria-hidden", "true");
            rowEl.appendChild(spacer);
            return;
          }
          rowEl.appendChild(makeKey(label));
        });
        keyboardEl.appendChild(rowEl);
      });
    }

    function updateBoard() {
      const tiles = boardEl.querySelectorAll(".tile");
      tiles.forEach((tile) => {
        const row = Number(tile.dataset.row);
        const col = Number(tile.dataset.col);
        const guess = guesses[row] || (row === guesses.length ? currentGuess : "");
        const letter = guess[col] || "";
        tile.textContent = letter;
        tile.classList.toggle("filled", letter !== "");
        if (!tile.classList.contains("correct") && !tile.classList.contains("present") && !tile.classList.contains("absent")) {
          tile.classList.remove("pop");
        }
      });
    }

    function scoreGuess(guess, answer) {
      const marks = Array(COLS).fill("absent");
      const answerLetters = answer.split("");

      for (let i = 0; i < COLS; i += 1) {
        if (guess[i] === answerLetters[i]) {
          marks[i] = "correct";
          answerLetters[i] = "*";
        }
      }

      for (let i = 0; i < COLS; i += 1) {
        if (marks[i] === "correct") continue;
        const idx = answerLetters.indexOf(guess[i]);
        if (idx > -1) {
          marks[i] = "present";
          answerLetters[idx] = "*";
        }
      }

      return marks;
    }

    function setKeyState(letter, state) {
      const key = document.querySelector(`.key[data-key="${letter}"]`);
      if (!key) return;
      const rank = { absent: 1, present: 2, correct: 3 };
      const current = key.classList.contains("correct")
        ? "correct"
        : key.classList.contains("present")
          ? "present"
          : key.classList.contains("absent")
            ? "absent"
            : "";
      if (!current || rank[state] > rank[current]) {
        key.classList.remove("absent", "present", "correct");
        key.classList.add(state);
      }
    }

    function revealGuess(guessIndex, marks) {
      const row = boardEl.children[guessIndex];
      [...row.children].forEach((tile, i) => {
        tile.classList.add(marks[i]);
        setKeyState(guesses[guessIndex][i], marks[i]);
      });
    }

    function isPositionAlreadyGuessed(position) {
      const expectedLetter = solution[position];
      if (currentGuess[position] === expectedLetter) {
        return true;
      }
      return guesses.some((guess) => guess[position] === expectedLetter);
    }


    function submitGuess() {
      if (currentGuess.length < COLS) {
        announce("Word must be 5 letters.");
        return;
      }
      if (!allowedWords.has(currentGuess.toLowerCase())) {
        announce("Not in British dictionary.");
        return;
      }

      const guess = currentGuess.toUpperCase();
      guesses.push(guess);
      currentGuess = "";
      updateBoard();

      const marks = scoreGuess(guess, solution);
      revealGuess(guesses.length - 1, marks);
      saveGameState();

      if (guess === solution) {
        gameOver = true;
        announce("Brilliant! You solved Purrrdle.");
        showCelebrationPopup();
        saveGameState();
        return;
      }

      if (guesses.length >= ROWS) {
        gameOver = true;
        announce(`Out of tries. The word was ${solution}.`);
        saveGameState();
        return;
      }

      announce("Keep going.");
    }

    function handleInput(raw) {
      const key = raw.toUpperCase();

      if (gameOver) {
        if (key === "ENTER") {
          const lastGuess = guesses[guesses.length - 1] || "";
          if (lastGuess === solution) {
            const modal = document.getElementById("celebration-modal");
            if (!modal.classList.contains("open")) {
              showCelebrationPopup();
            }
          }
        }
        return;
      }

      if (key === "ENTER") {
        submitGuess();
        return;
      }

      if (key === "BACKSPACE" || key === "DEL") {
        if (currentGuess.length > 0) {
          currentGuess = currentGuess.slice(0, -1);
          updateBoard();
        }
        return;
      }

      if (/^[A-Z]$/.test(key) && currentGuess.length < COLS) {
        currentGuess += key;
        updateBoard();

        const row = boardEl.children[guesses.length];
        const tile = row.children[currentGuess.length - 1];
        tile.classList.add("pop");
        setTimeout(() => tile.classList.remove("pop"), 130);
      }
    }

    function resetGame() {
      solution = pickDailyWord();
      guesses = [];
      currentGuess = "";
      gameOver = false;
      createBoard();
      createKeyboard();

      const savedState = loadSavedState();
      if (savedState && Array.isArray(savedState.guesses) && savedState.guesses.length) {
        restoreSavedState(savedState);
        return;
      }

      announce("Guess the 5-letter word.");
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        handleInput("ENTER");
        return;
      }
      if (event.key === "Backspace") {
        handleInput("BACKSPACE");
        return;
      }
      if (/^[a-zA-Z]$/.test(event.key)) {
        handleInput(event.key);
      }
    });

    resetGame();
  </script>
</body>
</html>
